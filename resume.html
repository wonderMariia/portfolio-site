<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resume of Mariia Riabushenko: AI-Driven Product Manager with expertise in CRM, ERP, and digital transformation.">
    <title>Resume | Mariia Riabushenko</title>
    <link rel="stylesheet" href="css/sherlaine-style.css">
    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            padding: 12px 20px;
            background: #2563EB;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            position: absolute;
            top: 50px;
            left: 0;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
            border: none;
        }
        
        .back-link:hover {
            background: #1d4ed8;
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .resume-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 32px;
            padding-top: 80px;
            position: relative;
        }
        .resume-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: -0.01em;
        }
        .download-btn {
            background: #FF69B4;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: background 0.2s, color 0.2s;
            position: absolute;
            top: 50px;
            right: 0;
        }
        .download-btn:hover {
            background: #e055a1;
            color: #fff;
        }
        .resume-container {
            width: 100%;
            border: 1.5px solid var(--color-border);
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            background: #fff;
            overflow: hidden;
        }
        
        .resume-viewer {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            border: none;
        }
        
        .resume-viewer:first-child {
            border-bottom: none;
        }
        @media (max-width: 700px) {
            .back-link {
                position: relative;
                top: auto;
                left: auto;
                margin-bottom: 16px;
            }
            .resume-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
            }
            .download-btn {
                width: 100%;
                padding: 12px 0;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <a href="index.html" class="back-link">← Back to Portfolio</a>
        <div class="resume-header">
            <span class="resume-title">Resume</span>
            <a href="images/Mariia-Riabushenko-PM.pdf" download class="download-btn">Download PDF</a>
        </div>
        <div class="resume-container">
            <img src="images/1_Mariia-Riabushenko.png" alt="Resume Header - Mariia Riabushenko" class="resume-viewer" />
            <img src="images/2_Work-Experience.png" alt="Resume Work Experience - Mariia Riabushenko" class="resume-viewer" />
        </div>
    </div>
</body>
</html>
